# Builds a Play-Store-ready release bundle (.aab) and a release APK of Deepward.
# Run it from GitHub: Actions -> "Android release" -> Run workflow (the button appears once this file is on the default
# branch). Signing needs four repository secrets (see RELEASE.md); without them the build still runs but the output is
# UNSIGNED and can be neither installed nor uploaded. Pushing a change to this file or to the Android patch on a ccr-*
# branch also runs it, to check the release build still works.
name: Android release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to players (e.g. 1.0.1)'
        default: '1.0'
      version_code:
        description: 'Integer that must rise with every Play Store upload (blank: this workflow''s run number)'
        default: ''
  push:
    branches: ['ccr-*']
    paths: ['.github/workflows/android-release.yml', 'tools/android_patch.js', 'resources/**']
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      VERSION_CODE: ${{ inputs.version_code || github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (the runner already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode the signing keystore (only if the secret exists)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release output will be unsigned"
          fi
      - name: Install Capacitor
        run: npm ci
      - name: Generate the Android project and copy the game into it
        run: |
          npm run www
          [ -d android ] || npx cap add android
          node tools/android_patch.js
          npx cap sync android
      - name: Build the release bundle and APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Name the outputs after the version
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/*.aab "out/deepward-$VERSION_NAME-$VERSION_CODE.aab"
          for f in android/app/build/outputs/apk/release/*.apk; do cp "$f" "out/deepward-$VERSION_NAME-$VERSION_CODE$( [[ $f == *unsigned* ]] && echo -unsigned ).apk"; done
      - uses: actions/upload-artifact@v6
        with:
          name: deepward-release
          path: out/*
          if-no-files-found: error
