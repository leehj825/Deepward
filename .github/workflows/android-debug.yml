# Builds an installable Android *debug* APK of Deepward (a Capacitor wrapper around the web game).
# Run it from GitHub: Actions -> "Android debug APK" -> Run workflow (the manual button appears once this file is on the
# default branch; until then, pushing game changes to a ccr-* branch starts it automatically). When it finishes, open the
# run and download the "deepward-debug-apk" artifact (a zip holding app-debug.apk), then install it on a phone.
name: Android debug APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main', 'ccr-*']
    paths: ['js/**', 'css/**', 'vendor/**', 'index.html', 'tools/make_www.js', 'tools/android_patch.js', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android-debug.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (the runner already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Capacitor
        run: npm ci
      - name: Generate the Android project and copy the game into it
        run: |
          npm run www
          [ -d android ] || npx cap add android
          node tools/android_patch.js
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK after the commit
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "deepward-debug-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: deepward-debug-apk
          path: deepward-debug-*.apk
          if-no-files-found: error
