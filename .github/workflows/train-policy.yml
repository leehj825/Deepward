# Trains the companions' battle policy on a GitHub runner (headless) and uploads the weights and the reports as an artifact.
# Two ways to start it (see docs/TRAINING.md):
#   - Actions -> "Train companion policy" -> Run workflow (the button appears once this file is on the default branch);
#   - from a work branch (ccr-*): create or edit tools/policy/train-request.json, e.g. {"kind": "real", "minutes": 45}, and commit it.
# Nothing is committed back: download the artifact, read the report, and commit js/policy_weights.js yourself if you accept it.
name: Train companion policy
on:
  push:
    branches: ['ccr-*']
    paths: ['tools/policy/train-request.json']
  workflow_dispatch:
    inputs:
      kind:
        description: 'real = against the real game (move preferences); simulator = the fast simulator, continuing the shipped weights'
        type: choice
        options: [real, simulator]
        default: real
      minutes:
        description: 'Minutes of training (the tests after it take another 10 to 15). Short runs (20) are safer: hosted runners can be cut short'
        default: '20'
jobs:
  train:
    runs-on: ubuntu-24.04            # not ubuntu-latest: Playwright 1.56 does not support its newest Ubuntu (26.04)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install a headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read the request
        id: req
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            kind="${{ inputs.kind }}"; minutes="${{ inputs.minutes }}"
          else
            kind=$(node -p "require('./tools/policy/train-request.json').kind || 'real'")
            minutes=$(node -p "require('./tools/policy/train-request.json').minutes || 45")
          fi
          [ "$minutes" -gt 110 ] && minutes=110
          echo "kind=$kind" >> "$GITHUB_OUTPUT"; echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "Training: $kind for $minutes minutes"
      - name: Train
        run: |
          if [ "${{ steps.req.outputs.kind }}" = "real" ]; then
            RESUME=1 node tools/policy/real_train.js "${{ steps.req.outputs.minutes }}" 2
          else
            node tools/policy/train.js "${{ steps.req.outputs.minutes }}" --continue
          fi
      - name: Check the result in the real game
        run: node tools/policy_test.js 8 || true
      - uses: actions/upload-artifact@v4
        if: always()                     # also when the runner was cut short: the checkpoint is the best preferences so far
        with:
          name: companion-policy
          if-no-files-found: warn
          path: |
            js/policy_weights.js
            docs/policy-report.md
            docs/real-training-report.md
            tools/policy/real-checkpoint.json
